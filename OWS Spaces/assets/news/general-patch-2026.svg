<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.5" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0fb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="220" fill="#ffffff" opacity="0.05"/>
  <circle cx="120" cy="520" r="260" fill="#000000" opacity="0.12"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#accent)"/>

  <text x="70" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#fbbf24">🚀 GENERAL PATCH</text>
  <text x="70" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" fill="#ffffff">Status Pages, ahora con</text>
  <text x="70" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" fill="#ffffff">todo lo que pediste</text>
  <text x="70" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#c7d2fe">Drag &amp; drop · Anuncios · Banners de demora · Notas por estado</text>

  <!-- Card tipo status preview -->
  <g transform="translate(620, 300)">
    <rect width="510" height="240" rx="22" fill="url(#card)"/>
    <circle cx="40" cy="40" r="16" fill="#22c55e"/>
    <text x="66" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e2340">All Systems Operational</text>
    <text x="66" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5a6070">4 servicios operando con normalidad</text>
    <line x1="0" y1="96" x2="510" y2="96" stroke="#dde0ee" stroke-width="1.5"/>
    <g font-family="Segoe UI, Arial, sans-serif">
      <circle cx="34" cy="132" r="8" fill="#22c55e"/>
      <text x="52" y="138" font-size="16" font-weight="600" fill="#2d3352">API REST</text>
      <circle cx="262" cy="132" r="8" fill="#f59e0b"/>
      <text x="280" y="138" font-size="16" font-weight="600" fill="#2d3352">Webhooks</text>
      <text x="410" y="138" font-size="12" fill="#8f97b8">⏳ 30 h</text>
      <circle cx="34" cy="172" r="8" fill="#22c55e"/>
      <text x="52" y="178" font-size="16" font-weight="600" fill="#2d3352">Base de datos</text>
      <circle cx="262" cy="172" r="8" fill="#ef4444"/>
      <text x="280" y="178" font-size="16" font-weight="600" fill="#2d3352">CDN</text>
    </g>
    <rect x="24" y="200" width="150" height="26" rx="13" fill="#fef3c7"/>
    <text x="40" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">📢 Anuncios · 1 próximo</text>
  </g>

  <!-- Feature chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#e0e7ff">
    <rect x="70" y="340" width="180" height="52" rx="14" fill="#ffffff" opacity="0.10" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="90" y="372">🧲 Drag &amp; drop</text>
    <rect x="270" y="340" width="180" height="52" rx="14" fill="#ffffff" opacity="0.10" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="290" y="372">📢 Anuncios</text>
    <rect x="470" y="340" width="200" height="52" rx="14" fill="#ffffff" opacity="0.10" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="490" y="372">⏳ Banners de demora</text>
  </g>

  <text x="70" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#a5b4fc">Blog del equipo — Ocean and Wild Studios</text>
</svg>
