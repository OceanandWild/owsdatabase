name: WaverNote Release

# Compila WaverNote para Windows (Tauri/NSIS) y Android (Tauri/APK universal)
# y publica ambos instaladores en la release del repo owsdatabase.
#
# La firma Android usa SIEMPRE la keystore universal del ecosistema OWS
# (secrets ANDROID_SIGNING_KEY_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD). Este workflow NO genera ni
# rota llaves: si faltan los secrets, falla en vez de firmar con otra cosa.
#
# La firma Windows usa una llave propia de WaverNote (secrets
# WAVERNOTE_TAURI_SIGNING_KEY / WAVERNOTE_TAURI_SIGNING_KEY_PASSWORD). El
# build genera el .sig y, al publicar, se actualizan los manifiestos
# wavernote-update.json (Windows) y wavernote-android-update.json (Android)
# en la rama main, que es de donde los lee la app instalada.
#
# Tag de release: wavernote-v<version>  (ej. wavernote-v1.0.0)
# Assets:
#   WaverNote_<version>_x64-setup.exe (+ .sig)
#   WaverNote_<version>_universal.apk

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión de WaverNote (ej. 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      release_notes:
        description: 'Notas de la release (opcional)'
        required: false
        default: ''
        type: string
      platform:
        description: 'Qué compilar y publicar'
        required: true
        default: both
        type: choice
        options:
          - both
          - windows
          - android

permissions:
  contents: write

env:
  PROJECT_DIR: web/WaverNote
  VERSION: ${{ inputs.version }}
  TAG: wavernote-v${{ inputs.version }}
  NDK_VERSION: '27.2.12479018'

jobs:
  windows:
    name: Windows · NSIS x64
    if: ${{ inputs.platform != 'android' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/WaverNote/package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          # El crate vive en web/WaverNote/src-tauri, no en la raíz del repo.
          cache-workspaces: ${{ env.PROJECT_DIR }}/src-tauri

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci

      - name: Set version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: pwsh
        run: node scripts/set-version.mjs "$env:VERSION"

      - name: Build NSIS
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.WAVERNOTE_TAURI_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.WAVERNOTE_TAURI_SIGNING_KEY_PASSWORD }}
        run: npm run build

      - name: Collect installer
        shell: pwsh
        run: |
          $nsis = Join-Path "${{ env.PROJECT_DIR }}" "src-tauri\target\release\bundle\nsis"
          $exe = Get-ChildItem -Path $nsis -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "No se encontró el instalador NSIS en $nsis" }
          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path $sig)) {
            throw "No se generó la firma .sig del instalador. Revisá WAVERNOTE_TAURI_SIGNING_KEY."
          }
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          $dest = "dist-win\WaverNote_${{ env.VERSION }}_x64-setup.exe"
          Copy-Item -LiteralPath $exe.FullName -Destination $dest -Force
          Copy-Item -LiteralPath $sig -Destination "$dest.sig" -Force
          Write-Host "Instalador firmado listo: $dest ($($exe.Length) bytes)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavernote-windows
          path: |
            dist-win/WaverNote_*_x64-setup.exe
            dist-win/WaverNote_*_x64-setup.exe.sig
          if-no-files-found: error

  android:
    name: Android · APK universal firmado
    if: ${{ inputs.platform != 'windows' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/WaverNote/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          # El runner de ubuntu ya trae el SDK de Android. Evitamos
          # android-actions/setup-android@v3 porque intenta instalar el
          # paquete "tools" (ya inexistente) y falla antes de compilar.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager en el runner"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Setup Rust + Android targets
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          cache: true
          # El crate vive en web/WaverNote/src-tauri, no en la raíz del repo.
          cache-workspaces: ${{ env.PROJECT_DIR }}/src-tauri

      - name: Install NDK and SDK packages
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_PATH=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci

      - name: Set version
        working-directory: ${{ env.PROJECT_DIR }}
        run: node scripts/set-version.mjs "$VERSION"

      - name: Prepare universal Android keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_BASE64:-}" ]; then
            echo "::error::Falta ANDROID_SIGNING_KEY_BASE64. No se firma con otra llave."
            exit 1
          fi
          KEYSTORE="$GITHUB_WORKSPACE/$PROJECT_DIR/src-tauri/gen/android/ows-universal.jks"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 -d > "$KEYSTORE"
          {
            echo "storeFile=$KEYSTORE"
            echo "keyAlias=$KEY_ALIAS"
            echo "password=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
          echo "Keystore universal lista ($(stat -c%s "$KEYSTORE") bytes)"

      - name: Build APK universal
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run android:build

      - name: Verify and collect APK
        id: apk
        working-directory: ${{ env.PROJECT_DIR }}/src-tauri/gen/android
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          # Tauri genera un APK universal y uno por ABI. La app publica es la universal.
          APK_PATH=$(find app/build/outputs/apk -name "*universal*release*.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*release*.apk" ! -name "*unsigned*" | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" ! -name "*unsigned*" | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::No se encontró el APK de release"
            exit 1
          fi
          echo "APK: $APK_PATH ($(stat -c%s "$APK_PATH") bytes)"
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "$APK_PATH"
          mkdir -p "$GITHUB_WORKSPACE/dist-android"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/dist-android/WaverNote_${{ env.VERSION }}_universal.apk"
          echo "path=$GITHUB_WORKSPACE/dist-android/WaverNote_${{ env.VERSION }}_universal.apk" >> "$GITHUB_OUTPUT"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavernote-android
          path: dist-android/WaverNote_*_universal.apk
          if-no-files-found: error

  publish:
    name: Publicar release
    needs: [windows, android]
    # Solo publica si las plataformas pedidas compilaron: con platform=android
    # el job de Windows queda "skipped" y no debe bloquear la release.
    if: >
      ${{ !cancelled() &&
          (inputs.platform == 'windows' || needs.android.result == 'success') &&
          (inputs.platform == 'android' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create/update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          REPO="OceanandWild/owsdatabase"
          TAG="${TAG}"
          TITLE="WaverNote ${VERSION}"
          NOTES="${RELEASE_NOTES:-}"
          if [ -z "$NOTES" ]; then
            if [ "${{ inputs.platform }}" = "android" ]; then
              NOTES="WaverNote ${VERSION} — APK para Android."
            else
              NOTES="WaverNote ${VERSION} — disponible para Windows y Android."
            fi
          fi
          # Las betas/RC se publican como pre-release: así no quedan como
          # "Latest" del repo (owsdatabase aloja releases de varios proyectos)
          # y siguen descargables por URL directa.
          PRERELEASE=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=(--prerelease --latest=false)
          fi
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "$TITLE" --notes "$NOTES" "${PRERELEASE[@]}"
          fi
          find artifacts -type f
          gh release upload "$TAG" --repo "$REPO" --clobber $(find artifacts -type f)
          echo "Release lista: https://github.com/$REPO/releases/tag/$TAG"

      - name: Generate update manifests
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["VERSION"].strip()
          tag = os.environ["TAG"].strip()
          notes = (os.environ.get("RELEASE_NOTES") or "").strip()
          repo = "OceanandWild/owsdatabase"
          release_base = f"https://github.com/{repo}/releases/download/{tag}"
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          def find(pattern):
              result = sorted(Path("artifacts").rglob(pattern))
              return str(result[0]) if result else ""

          win_exe = find("*_x64-setup.exe")
          win_sig = find("*_x64-setup.exe.sig")
          apk = find("*_universal.apk")

          if win_exe and win_sig:
              with open(win_sig, "r", encoding="utf-8") as handle:
                  signature = handle.read().strip()
              if not signature:
                  raise SystemExit("La firma .sig del instalador de Windows está vacía.")
              manifest = {
                  "version": version,
                  "notes": notes or f"WaverNote {version} para Windows.",
                  "pub_date": now,
                  "platforms": {
                      "windows-x86_64": {
                          "url": f"{release_base}/{os.path.basename(win_exe)}",
                          "signature": signature,
                      }
                  },
              }
              with open("wavernote-update.json", "w", encoding="utf-8") as handle:
                  json.dump(manifest, handle, ensure_ascii=False, indent=2)
                  handle.write("\n")
              print("wavernote-update.json listo")
          else:
              print("Sin instalador firmado de Windows: no se toca wavernote-update.json")

          if apk:
              with open(apk, "rb") as handle:
                  apk_bytes = handle.read()
              numeric = [int(part) for part in re.findall(r"\d+", version.split("-")[0])[:3]]
              while len(numeric) < 3:
                  numeric.append(0)
              # Misma fórmula que Tauri para el versionCode del APK:
              # major * 1_000_000 + minor * 1_000 + patch.
              version_code = numeric[0] * 1_000_000 + numeric[1] * 1_000 + numeric[2]
              manifest = {
                  "project_slug": "wavernote",
                  "package_id": "com.oceanwildstudios.wavernote",
                  "version_name": version,
                  "version_code": version_code,
                  "apk_url": f"{release_base}/{os.path.basename(apk)}",
                  "sha256": hashlib.sha256(apk_bytes).hexdigest(),
                  "size_bytes": len(apk_bytes),
                  "release_notes": notes or f"WaverNote {version} para Android.",
                  "published_at": now,
              }
              with open("wavernote-android-update.json", "w", encoding="utf-8") as handle:
                  json.dump(manifest, handle, ensure_ascii=False, indent=2)
                  handle.write("\n")
              print("wavernote-android-update.json listo")
          else:
              print("Sin APK: no se toca wavernote-android-update.json")
          PY

      - name: Commit manifests to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for file in wavernote-update.json wavernote-android-update.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "Manifiestos sin cambios."
            exit 0
          fi
          git commit -m "chore(wavernote): manifiestos de actualización ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
